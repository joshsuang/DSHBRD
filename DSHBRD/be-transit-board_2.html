<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>BE Transit Board</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: #050505;
    font-family: 'Courier New', monospace;
    margin: 0;
    padding: 20px;
    color: #ffb000;
  }
  #controls { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  input {
    background: #111; border: 1px solid #333; color: #ffb000;
    padding: 8px 10px; border-radius: 4px; font-family: inherit;
    font-size: 13px; flex: 1 1 260px; outline: none;
  }
  input::placeholder { color: #554400; }
  button {
    background: #1a1400; border: 1px solid #443300; color: #ffb000;
    padding: 8px 14px; border-radius: 4px; cursor: pointer; font-size: 13px;
    font-family: inherit;
  }
  #favorites { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .fav-chip {
    background: #1a1400; border: 1px solid #443300; color: #ffb000;
    padding: 4px 10px; border-radius: 12px; cursor: pointer; font-size: 12px;
    font-family: inherit;
  }
  .boards-row { display: flex; gap: 14px; flex-wrap: wrap; }
  .group-divider { border-top: 1px dashed #222; margin: 14px 0; opacity: 0.4; display: none; }
  .board {
    background: #0c0c0c; border: 1px solid #2a2a2a; border-radius: 4px;
    padding: 16px 18px; min-width: 320px; flex: 1 1 360px;
  }
  .board-header {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 10px;
  }
  .station-name { font-size: 13px; letter-spacing: 1px; text-transform: uppercase; font-weight: 700; }
  .board-actions button { background: none; border: none; color: #ffb000; cursor: pointer; padding: 2px; font-size: 13px; }
  .remove-btn { color: #665500 !important; }
  .star-btn.active { color: #ffb000 !important; }
  .star-btn { color: #443300 !important; }
  .search-btn { color: #997700 !important; }
  .board-title { display: flex; align-items: center; }
  .drag-handle {
    display: inline-grid; grid-template-columns: repeat(2, 4px); grid-template-rows: repeat(3, 4px);
    gap: 3px; cursor: grab; opacity: 0.35; margin-right: 8px;
  }
  .drag-handle:hover { opacity: 0.8; }
  .drag-handle span { width: 4px; height: 4px; border-radius: 50%; background: #ffb000; }
  .board { transition: transform 200ms ease, opacity 150ms ease; }
  .board.dragging { opacity: 0.35; }
  .search-row { display: none; gap: 6px; margin-bottom: 10px; }
  .search-row.active { display: flex; }
  .search-row input {
    background: #111; border: 1px solid #333; color: #ffb000;
    padding: 6px 8px; border-radius: 4px; font-family: inherit;
    font-size: 12px; flex: 1; outline: none;
  }
  .dep-row {
    display: grid; grid-template-columns: 46px 30px 1fr 46px 44px 40px 30px; gap: 6px;
    align-items: baseline; font-size: 12px; padding: 4px 0; border-bottom: 1px dashed #222;
  }
  .dep-time { font-weight: 700; }
  .dep-badge {
    font-size: 10px; font-weight: 700; padding: 1px 4px; border-radius: 3px;
    background: #442200; color: #ffb000; text-align: center;
  }
  .dep-badge.strain { background: #ffb000; color: #000; }
  .dep-dest { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-transform: uppercase; }
  .dep-arr, .dep-stops { color: #997700; }
  .dep-delay { color: #665500; }
  .dep-delay.late { color: #ff5c5c; }
  .dep-plat { color: #665500; }
  .empty, .error { color: #665500; font-size: 12px; }
  .error { color: #ff5c5c; }
</style>
</head>
<body>

<div id="controls">
  <input id="stationInput" placeholder="Add station, e.g. Gent-Sint-Pieters" />
  <button onclick="addStation()">+ Add</button>
</div>

<div id="favorites"></div>

<div id="boards-fav" class="boards-row"></div>
<div class="group-divider" id="groupDivider"></div>
<div id="boards-other" class="boards-row"></div>

<script>
let stations = loadStations();
const timers = {};
const vehicleCache = {};
const searchQueries = {};

function loadStations() {
  try {
    const saved = JSON.parse(localStorage.getItem("beTransitStations"));
    if (Array.isArray(saved) && saved.length) return saved;
  } catch (e) {}
  return ["Antwerpen-Centraal", "Brussel-Zuid"];
}

function saveStations() {
  localStorage.setItem("beTransitStations", JSON.stringify(stations));
}

function toggleSearch(station) {
  const row = document.getElementById("search-" + cssId(station));
  row.classList.toggle("active");
  if (row.classList.contains("active")) row.querySelector("input").focus();
}

function applySearch(station, query) {
  const q = query.trim();
  if (q) searchQueries[station] = q;
  else delete searchQueries[station];
  fetchBoard(station);
}

function clearSearch(station) {
  delete searchQueries[station];
  const row = document.getElementById("search-" + cssId(station));
  row.classList.remove("active");
  row.querySelector("input").value = "";
  fetchBoard(station);
}

function loadFavorites() {
  try {
    return JSON.parse(localStorage.getItem("beTransitFavorites") || "[]");
  } catch (e) {
    return [];
  }
}

function saveFavorites(favs) {
  localStorage.setItem("beTransitFavorites", JSON.stringify(favs));
}

function toggleFavorite(station) {
  let favs = loadFavorites();
  if (favs.includes(station)) {
    favs = favs.filter(f => f !== station);
  } else {
    favs.push(station);
  }
  saveFavorites(favs);
  renderFavorites();
  renderBoards();
}

function renderFavorites() {
  const favs = loadFavorites();
  const el = document.getElementById("favorites");
  el.innerHTML = favs.map(f =>
    `<span class="fav-chip" onclick="addFavorite('${f.replace(/'/g, "\\'")}')">&#9733; ${f}</span>`
  ).join("");
}

function addFavorite(station) {
  if (!stations.includes(station)) {
    stations.push(station);
    saveStations();
    renderBoards();
  }
}

function formatDelay(seconds) {
  const s = parseInt(seconds, 10) || 0;
  if (s === 0) return null;
  return "+" + Math.round(s / 60);
}

function formatTime(unixSeconds) {
  const d = new Date(parseInt(unixSeconds, 10) * 1000);
  return d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
}

// Vehicle id looks like "BE.NMBS.IC1832" or "BE.NMBS.S1234".
// Type = leading letters of the short name (IC, S, L, P, THA, EUR...).
function trainType(vehicleId, vehicleinfo) {
  const shortname = vehicleinfo?.shortname || vehicleId.split(".").pop();
  const match = shortname.match(/^[A-Za-z]+/);
  return match ? match[0].toUpperCase() : "?";
}

async function fetchVehicleInfo(vehicleId) {
  if (vehicleCache[vehicleId]) return vehicleCache[vehicleId];
  try {
    const url = "https://api.irail.be/vehicle/?id=" + encodeURIComponent(vehicleId) + "&format=json&lang=en";
    const res = await fetch(url, { headers: { Accept: "application/json" } });
    if (!res.ok) throw new Error("vehicle fetch failed");
    const data = await res.json();
    let stops = data?.stops?.stop || [];
    if (!Array.isArray(stops)) stops = [stops];
    const last = stops[stops.length - 1];
    const info = {
      arrival: last ? last.time : null,
      arrivalStation: last ? last.station : null,
      stopCount: stops.length,
    };
    vehicleCache[vehicleId] = info;
    return info;
  } catch (e) {
    return { arrival: null, arrivalStation: null, stopCount: null };
  }
}

async function fetchBoard(station) {
  const el = document.getElementById("board-" + cssId(station));
  if (!el) return;
  const body = el.querySelector(".board-body");
  body.innerHTML = '<div class="empty">Loading...</div>';
  try {
    const url = "https://api.irail.be/liveboard/?station=" + encodeURIComponent(station) + "&format=json&lang=en&arrdep=departure";
    const res = await fetch(url, { headers: { Accept: "application/json" } });
    if (!res.ok) throw new Error("iRail returned " + res.status);
    const data = await res.json();
    let deps = data?.departures?.departure || [];
    if (!Array.isArray(deps)) deps = [deps];
    el.querySelector(".station-name").textContent = data.station || station;

    const query = searchQueries[station];
    if (query) {
      deps = deps.filter(d => (d.station || "").toLowerCase().includes(query.toLowerCase()));
    }

    if (deps.length === 0) {
      body.innerHTML = query
        ? '<div class="empty">No departures found to "' + query + '".</div>'
        : '<div class="empty">No departures found. Check the station name.</div>';
      return;
    }
    const shown = deps.slice(0, 6);
    body.innerHTML = shown.map(() =>
      '<div class="dep-row"><span class="empty">...</span></div>'
    ).join("");

    const rows = await Promise.all(shown.map(async dep => {
      const delay = formatDelay(dep.delay);
      const plat = (dep.platform && dep.platform !== "?") ? "P" + dep.platform : "";
      const type = trainType(dep.vehicle, dep.vehicleinfo);
      const isS = type === "S";
      const vinfo = await fetchVehicleInfo(dep.vehicle);
      const arr = vinfo.arrival ? formatTime(vinfo.arrival) : "-";
      const stops = vinfo.stopCount ? (vinfo.stopCount - 1) + " stops" : "-";
      return `<div class="dep-row">
        <span class="dep-time">${formatTime(dep.time)}</span>
        <span class="dep-badge ${isS ? 'strain' : ''}">${type}</span>
        <span class="dep-dest">${dep.station}</span>
        <span class="dep-arr">${arr}</span>
        <span class="dep-stops">${stops}</span>
        <span class="dep-delay ${delay ? 'late' : ''}">${delay || 'ON TIME'}</span>
        <span class="dep-plat">${plat}</span>
      </div>`;
    }));
    body.innerHTML = rows.join("");
  } catch (e) {
    body.innerHTML = '<div class="error">Could not load: ' + e.message + '</div>';
  }
}

function cssId(station) {
  return station.replace(/[^a-zA-Z0-9]/g, "_");
}

function boardTemplate(s, isFav) {
  const esc = s.replace(/'/g, "\\'");
  return `
    <div class="board" id="board-${cssId(s)}" data-station="${s}">
      <div class="board-header">
        <div class="board-title">
          <span class="drag-handle" title="Drag to reorder">
            <span></span><span></span><span></span><span></span><span></span><span></span>
          </span>
          <span class="station-name">${s}</span>
        </div>
        <div class="board-actions">
          <button class="search-btn" onclick="toggleSearch('${esc}')" title="Search destination">&#128269;</button>
          <button class="star-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite('${esc}')" title="Favorite">&#9733;</button>
          <button onclick="fetchBoard('${esc}')" title="Refresh">&#8635;</button>
          <button class="remove-btn" onclick="removeStation('${esc}')" title="Remove">&times;</button>
        </div>
      </div>
      <div class="search-row" id="search-${cssId(s)}">
        <input type="text" placeholder="Search destination, e.g. Gent"
          onkeydown="if(event.key==='Enter') applySearch('${esc}', this.value)" />
        <button onclick="clearSearch('${esc}')" title="Clear search">&times;</button>
      </div>
      <div class="board-body"><div class="empty">Loading...</div></div>
    </div>
  `;
}

function renderBoards() {
  const favs = loadFavorites();
  const favStations = stations.filter(s => favs.includes(s));
  const otherStations = stations.filter(s => !favs.includes(s));

  document.getElementById("boards-fav").innerHTML =
    favStations.map(s => boardTemplate(s, true)).join("");
  document.getElementById("boards-other").innerHTML =
    otherStations.map(s => boardTemplate(s, false)).join("");
  document.getElementById("groupDivider").style.display =
    (favStations.length && otherStations.length) ? "block" : "none";

  stations.forEach(s => {
    fetchBoard(s);
    if (timers[s]) clearInterval(timers[s]);
    timers[s] = setInterval(() => fetchBoard(s), 45000);
  });
  attachDragHandlers();
}

function addStation() {
  const input = document.getElementById("stationInput");
  const name = input.value.trim();
  if (name && !stations.includes(name)) {
    stations.push(name);
    saveStations();
    renderBoards();
  }
  input.value = "";
}

function removeStation(name) {
  stations = stations.filter(s => s !== name);
  if (timers[name]) clearInterval(timers[name]);
  saveStations();
  renderBoards();
}

function attachDragHandlers() {
  document.querySelectorAll(".drag-handle").forEach(handle => {
    handle.addEventListener("mousedown", () => {
      handle.closest(".board").setAttribute("draggable", "true");
    });
    handle.addEventListener("mouseup", () => {
      handle.closest(".board").setAttribute("draggable", "false");
    });
  });
  document.querySelectorAll(".board").forEach(board => {
    board.addEventListener("dragstart", e => {
      board.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", board.dataset.station);
    });
    board.addEventListener("dragend", () => {
      board.classList.remove("dragging");
      board.setAttribute("draggable", "false");
      syncStationsFromDOM();
    });
  });
}

function getDragTarget(container, x, y) {
  const boards = [...container.querySelectorAll(".board:not(.dragging)")];
  let closest = { dist: Infinity, el: null, rect: null };
  boards.forEach(b => {
    const rect = b.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const dist = Math.hypot(x - cx, y - cy);
    if (dist < closest.dist) closest = { dist, el: b, rect };
  });
  return closest;
}

function syncStationsFromDOM() {
  const favOrder = [...document.getElementById("boards-fav").querySelectorAll(".board")].map(b => b.dataset.station);
  const otherOrder = [...document.getElementById("boards-other").querySelectorAll(".board")].map(b => b.dataset.station);
  stations = [...favOrder, ...otherOrder];
  saveStations();
}

function setupDragover(containerId) {
  document.getElementById(containerId).addEventListener("dragover", e => {
    e.preventDefault();
    const dragging = document.querySelector(".board.dragging");
    if (!dragging) return;
    const container = e.currentTarget;
    if (dragging.parentNode !== container) return; // no cross-group drag

    const target = getDragTarget(container, e.clientX, e.clientY);
    if (!target.el || target.el === dragging) return;

    const prevRects = {};
    container.querySelectorAll(".board").forEach(b => {
      prevRects[b.dataset.station] = b.getBoundingClientRect();
    });

    const before = e.clientX < target.rect.left + target.rect.width / 2;
    container.insertBefore(dragging, before ? target.el : target.el.nextSibling);

    container.querySelectorAll(".board").forEach(b => {
      const first = prevRects[b.dataset.station];
      if (!first) return;
      const last = b.getBoundingClientRect();
      const dx = first.left - last.left;
      const dy = first.top - last.top;
      if (dx || dy) {
        b.style.transition = "none";
        b.style.transform = `translate(${dx}px, ${dy}px)`;
        requestAnimationFrame(() => {
          b.style.transition = "transform 200ms ease";
          b.style.transform = "";
        });
      }
    });
  });
}
setupDragover("boards-fav");
setupDragover("boards-other");

document.getElementById("stationInput").addEventListener("keydown", e => {
  if (e.key === "Enter") addStation();
});

renderFavorites();
renderBoards();
</script>

</body>
</html>
